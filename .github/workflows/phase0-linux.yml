name: Desktop Phase 0 Linux Build

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-qt6:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: invent-registry.kde.org/sysadmin/ci-images/suse-qt611:latest

    env:
      KDECI_PLATFORM_PATH: suse-qt6.11
      KDECI_CC_CACHE: /tmp/kde-ci-caches
      KDECI_CACHE_PATH: /tmp/kde-ci-artifacts
      KDECI_GITLAB_SERVER: https://invent.kde.org/
      KDECI_PACKAGE_PROJECT: teams/ci-artifacts/suse-qt6.11
      CI_PROJECT_NAME: kdeconnect-kde
      CI_COMMIT_REF_NAME: develop
      CI_PROJECT_PATH: ShadowUR0/kdeconnect-kde

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare KDE CI utilities
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clone https://invent.kde.org/sysadmin/ci-utilities.git --depth=1
          git clone https://invent.kde.org/sysadmin/repo-metadata.git ci-utilities/repo-metadata/ --depth=1

      - name: Configure, build, install, and test
        shell: bash
        env:
          CI_PROJECT_DIR: ${{ github.workspace }}
          CI_BUILDS_DIR: ${{ github.workspace }}
        run: |
          set -o pipefail
          python3 -u ci-utilities/run-ci-build.py             --project kdeconnect-kde             --branch master             --platform Linux/Qt6/Shared             --extra-cmake-args=-DBUILD_WITH_QT6=ON             --extra-cmake-args=-DQT_MAJOR_VERSION=6 2>&1 | tee phase0-desktop-build.log

      - name: Upload Phase 0 desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-phase0-build
          if-no-files-found: warn
          retention-days: 14
          path: |
            phase0-desktop-build.log
            JUnitTestResults.xml
            CoberturaLcovResults.xml
            _install/**
